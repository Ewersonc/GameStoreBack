spring.application.name=gamestore

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gamestore}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET:gamestore-chave-de-desenvolvimento-troque-em-producao-0123456789}
app.jwt.expiration-minutes=120

app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
